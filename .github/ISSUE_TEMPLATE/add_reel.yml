name: Add Instagram Media
description: Submit one or more Instagram Reel or Post URLs for automatic ingestion
title: "Add Instagram Media"
body:
  - type: textarea
    id: urls
    attributes:
      label: Instagram Reel or Post URL(s)
      description: Paste one or more /reel/ or /p/ URLs, one per line.
      placeholder: https://www.instagram.com/p/XXXXXXXXXXX/
    validations:
      required: true
