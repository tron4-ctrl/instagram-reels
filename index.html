<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TROY</title>
<style>
:root{
  --bg:#0a0b0f; --bg2:#0d0f15;
  --panel:#12141c; --panel2:#181b26; --panel3:#1e2230;
  --border:#262b3a; --border-soft:#1c2030;
  --text:#f2f3f7; --muted:#9aa2b8; --muted2:#6b7285;
  --accent:#8b5cf6; --accent2:#ec4899; --accent-soft:rgba(139,92,246,0.15);
  --good:#22c55e; --good-soft:rgba(34,197,94,0.14);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,0.14);
  --dup:#ec4899; --dup-soft:rgba(236,72,153,0.14);
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px -10px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%, #1a1030 0%, transparent 60%),
             radial-gradient(1000px 500px at 100% 0%, #0d1a2e 0%, transparent 55%),
             var(--bg);
  color:var(--text); -webkit-font-smoothing:antialiased;}
a{color:inherit;}

header{position:sticky;top:0;z-index:60;background:rgba(10,11,15,0.88);backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--border-soft);
  will-change:transform,opacity;
  transition:opacity .24s ease,transform .28s cubic-bezier(.22,.61,.36,1),background .2s ease;
  opacity:1;transform:translateY(0);pointer-events:auto;}
header.header-compact .header-inner{padding-top:10px;padding-bottom:9px;}
header.header-compact .subtitle{display:none;}
header.header-compact .dash{grid-template-columns:repeat(5,minmax(110px,1fr));gap:7px;margin-top:8px;}
header.header-compact .stat{padding:7px 9px;}
header.header-compact .stat .num{font-size:1rem;}
header.header-hidden{opacity:0;transform:translateY(calc(-100% - 12px));pointer-events:none;}
.header-inner{max-width:1400px;margin:0 auto;padding:14px 24px 12px;}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
.title-row h1{
  margin:0;
  font-size:1.5rem;
  font-weight:850;
  letter-spacing:-0.025em;
  background:linear-gradient(90deg,#f7e7b2 0%,#fff8df 45%,#d8b86a 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 2px 18px rgba(216,184,106,.16);
}
.title-row .tag{font-size:0.72rem;color:var(--muted2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
.subtitle{color:var(--muted);font-size:0.86rem;margin-bottom:16px;}

.dash{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;position:relative;overflow:hidden;}
.stat:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow);}
.stat.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.stat .num{font-size:1.35rem;font-weight:800;letter-spacing:-0.01em;}
.stat .lbl{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
.stat.c-total .num{color:#fff;}
.stat.c-avail .num{color:var(--good);}
.stat.c-missing .num{color:var(--warn);}
.stat.c-dup .num{color:var(--dup);}
.stat.c-unique .num{color:#60a5fa;}

.controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
#search{flex:1;min-width:220px;padding:11px 16px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:0.92rem;transition:border-color .15s,box-shadow .15s;}
#search::placeholder{color:var(--muted2);}
#search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
select{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
  font-size:0.85rem;cursor:pointer;}
select:focus{outline:none;border-color:var(--accent);}
.btn-clear{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-size:0.82rem;white-space:nowrap;transition:all .15s;}
.btn-clear:hover{border-color:var(--accent2);color:var(--text);}

.pillbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.pill{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:0.78rem;font-weight:600;white-space:nowrap;transition:all .15s;}
.pill:hover{border-color:var(--accent);color:var(--text);}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.pill.active.pill-dup{background:var(--dup);border-color:var(--dup);}
.pill.active.pill-missing{background:var(--warn);border-color:var(--warn);color:#1a1200;}

#catbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#catbar::-webkit-scrollbar{height:6px;}
#catbar::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
#catbar button{flex:none;padding:6px 13px;border-radius:20px;border:1px solid var(--border-soft);background:var(--panel);
  color:var(--muted2);cursor:pointer;font-size:0.75rem;white-space:nowrap;transition:all .15s;}
#catbar button:hover{border-color:var(--accent);color:var(--text);}
#catbar button.active{background:var(--panel3);color:var(--text);border-color:var(--accent);}

.meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0 4px;
  color:var(--muted);font-size:0.8rem;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:var(--panel3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:0.72rem;color:var(--muted);}

main{max-width:1400px;margin:0 auto;padding:6px 24px 60px;}

#groupwrap .group{margin-bottom:26px;border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;
  background:linear-gradient(180deg,rgba(236,72,153,0.04),transparent);}
.group-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.group-head img{width:44px;height:62px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
.group-head .noimg-mini{width:44px;height:62px;border-radius:8px;border:1px solid var(--border);background:var(--panel3);}
.group-head .ghtext{font-size:0.85rem;color:var(--text);font-weight:700;}
.group-head .ghsub{font-size:0.72rem;color:var(--dup);font-weight:600;}

#grid,.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--border);}
.thumb{width:100%;aspect-ratio:9/14;background:#06070a;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.card:hover .thumb img{transform:scale(1.04);}
.thumb .noimg{color:var(--muted2);font-size:0.78rem;text-align:center;padding:10px;display:flex;flex-direction:column;
  align-items:center;gap:6px;}
.thumb .noimg .icon{font-size:1.6rem;opacity:0.5;}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.68);backdrop-filter:blur(4px);color:#fff;
  font-size:0.65rem;font-weight:600;padding:4px 9px;border-radius:20px;max-width:80%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.dupbadge{position:absolute;top:8px;right:8px;background:var(--dup);color:#fff;font-size:0.62rem;font-weight:700;
  padding:4px 8px;border-radius:20px;box-shadow:0 2px 8px rgba(236,72,153,0.5);}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-title{font-size:0.88rem;font-weight:700;line-height:1.32;margin:0;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.desc{font-size:0.75rem;color:var(--muted);line-height:1.45;max-height:4.3em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.meta{font-size:0.68rem;color:var(--muted2);margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  gap:6px;padding-top:4px;}
.meta .sc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0.8;}
.link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px;padding:9px;border-radius:10px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-size:0.78rem;
  font-weight:700;transition:filter .15s,transform .15s;}
.link:hover{filter:brightness(1.12);transform:translateY(-1px);}

#loadmore-wrap{display:flex;justify-content:center;padding:26px 0;}
#loadmore{padding:12px 28px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
  cursor:pointer;font-size:0.85rem;font-weight:600;transition:all .15s;}
#loadmore:hover{border-color:var(--accent);background:var(--panel3);}

#empty{display:none;text-align:center;padding:70px 20px;color:var(--muted);}
#empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:0.5;}
#empty .e-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px;}

#backtop{position:fixed;bottom:24px;right:24px;width:46px;height:46px;border-radius:50%;background:var(--panel3);
  border:1px solid var(--border);color:var(--text);cursor:pointer;display:none;align-items:center;justify-content:center;
  font-size:1.1rem;box-shadow:var(--shadow);z-index:70;transition:all .15s;}
#backtop:hover{border-color:var(--accent);transform:translateY(-2px);}
#backtop.show{display:flex;}

footer{max-width:1400px;margin:0 auto;padding:10px 24px 40px;color:var(--muted2);font-size:0.72rem;text-align:center;}

@media(max-width:900px){.dash{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){#grid,.group-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .header-inner{padding:14px 14px 12px;} main{padding:6px 14px 50px;}}
@media(max-width:640px){#category-wrap{align-items:stretch;flex-direction:column;gap:6px;}#category{width:100%;min-width:0;}header.header-compact .dash{grid-template-columns:repeat(2,1fr);}}
</style>
<style id="clean-layout-overrides">
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
header .header-inner{padding-bottom:11px;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:18px;}
.brand-copy{min-width:0;}
.total-badge{display:flex;align-items:baseline;gap:8px;flex:0 0 auto;padding:8px 13px;border:1px solid rgba(225,48,108,.38);border-radius:12px;background:rgba(225,48,108,.08);white-space:nowrap;}
.total-num{font-size:1.18rem;font-weight:850;color:#e1306c;}
.total-label{font-size:.76rem;font-weight:700;color:var(--muted);} 
.primary-controls{display:grid;grid-template-columns:minmax(280px,1fr) minmax(230px,.7fr) minmax(185px,.46fr) auto;gap:9px;align-items:center;}
.primary-controls input,.primary-controls select{width:100%;height:42px;}
.pillbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
.pill{height:36px;padding:0 13px;}
.btn-clear{height:42px;white-space:nowrap;}
@media(max-width:900px){.primary-controls{grid-template-columns:1fr 1fr;}.search-field{grid-column:1/-1;}.btn-clear{width:100%;}}
@media(max-width:640px){
  .header-inner{
    padding:8px 10px 8px;
  }

  .title-row{
    align-items:center;
    gap:8px;
    margin-bottom:7px;
  }

  .title-row h1{
    font-size:1.12rem;
  }

  .subtitle{
    display:none;
  }

  .total-badge{
    min-height:32px !important;
    padding:6px 10px !important;
    border-radius:10px !important;
  }

  .total-num{
    font-size:.76rem !important;
  }

  .primary-controls{
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .search-field{
    grid-column:1/-1;
  }

  .primary-controls input,
  .primary-controls select{
    height:36px;
    padding:7px 10px;
    font-size:.78rem;
  }

  .btn-clear{
    width:100%;
    height:36px;
    padding:7px 8px;
    font-size:.76rem;
  }

  .meta-row{
    padding:0;
    min-height:0;
  }

  header.header-compact .header-inner{
    padding-top:6px;
    padding-bottom:6px;
  }
}
</style><style id="status-pill-removal">
/* Cover-status pills are intentionally not part of the visible header UI. */
#pillbar,.pillbar{display:none!important;height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;}
</style><style id="instagram-count-overrides">
/* Premium Instagram-style total library count */
.total-badge{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  min-height:42px!important;
  padding:9px 18px!important;
  border:0!important;
  border-radius:14px!important;
  background:linear-gradient(135deg,#8b5cf6 0%,#c64ff1 48%,#ec4899 100%)!important;
  color:#fff!important;
  box-shadow:0 8px 20px rgba(201,76,229,.24), inset 0 1px 0 rgba(255,255,255,.18)!important;
  white-space:nowrap!important;
  flex:0 0 auto!important;
}
.total-num{
  color:#fff!important;
  font-size:.93rem!important;
  line-height:1!important;
  font-weight:800!important;
  letter-spacing:.01em!important;
}
.total-label{display:none!important;}
#resultCount{display:none!important;}
.meta-row{min-height:0!important;padding-top:6px!important;}
@media(max-width:640px){
  .total-badge{
    min-height:32px!important;
    padding:6px 10px!important;
    border-radius:10px!important;
  }

  .total-num{
    font-size:.76rem!important;
  }
}
</style><style id="header-state-overrides">
#libraryHeader.header-hidden{opacity:0!important;transform:translateY(-105%)!important;pointer-events:none!important;}
#libraryHeader.header-compact{opacity:.94!important;transform:translateY(0)!important;pointer-events:auto!important;}
#libraryHeader:not(.header-hidden),#libraryHeader.header-hidden{transition:opacity .24s ease,transform .24s ease;}
</style><style id="pro-free-hosting-overrides">
#pillbar,.pillbar{display:none!important!important;height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;}
.dash{display:none!important;}
.image-error{background:linear-gradient(135deg,#25101b,#11131a);}
.image-error img{display:none;}
</style></head>
<body>
<header id="libraryHeader">
  <div class="header-inner">
    <div class="title-row">
      <div class="brand-copy">
        <h1>TROY</h1>
        <div class="subtitle">A curated, searchable archive of your saved Instagram Reels.</div>
      </div>
      <div class="total-badge" aria-label="3,646 Reels in library" role="status">
        <span class="total-num" id="totalReelsCount">3,646 Reels</span>
      </div>
    </div>
    <div class="controls-row primary-controls">
      <div class="field search-field">
        <label class="sr-only" for="search">Search Reels</label>
        <input id="search" type="text" placeholder="Search title, description, creator, category, or shortcode…" autocomplete="off">
      </div>
      <div class="field category-field">
        <label class="sr-only" for="category">Category</label>
        <select id="category" aria-label="Select Reel category">
          <option value="All">All Categories</option>
        </select>
      </div>
      <div class="field sort-field">
        <label class="sr-only" for="sort">Sort Reels</label>
        <select id="sort" aria-label="Sort Reels">
          <option value="default">Sort: Default</option>
          <option value="cat_az">Category A–Z</option>
          <option value="cat_za">Category Z–A</option>
          <option value="title_az">Title A–Z</option>
          <option value="title_za">Title Z–A</option>
          <option value="creator_az">Creator A–Z</option>
          <option value="creator_za">Creator Z–A</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
      <button class="btn-clear" id="clearFilters" type="button">Clear filters</button>
    </div>
    <div class="meta-row">
      <div id="resultCount" aria-hidden="true">3,646 Reels</div>
      <div class="chips" id="activeChips"></div>
    </div>
  </div>
</header>

<main>
  <div id="groupwrap" style="display:none;"></div>
  <div id="grid"></div>
  <div id="loadmore-wrap"><button id="loadmore" style="display:none;">Load more Reels</button></div>
  <div id="empty">
    <div class="icon">&#128269;</div>
    <div class="e-title">No Reels match your filters</div>
    <div>Try a different search term or clear your filters.</div>
  </div>
</main>

<footer>TROY · Your Personal Reel Library</footer>

<button id="backtop" title="Back to top" aria-label="Back to top">&#8593;</button>

<script>
const PAGE_SIZE = 60;
let REC = [];
let META = {};
let state = { cover: 'all', cat: 'All', q: '', sort: 'default' };
let shown = 0;
let filtered = [];

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function imgSrc(r){
  return r && r.cov === 1 && r.img ? ('reel_covers/' + encodeURIComponent(r.img)) : null;
}

function passesCover(r, coverState){
  switch(coverState){
    case 'available': return r.cov === 1;
    case 'dup': return r.dn > 1;
    case 'unique': return r.cov === 1 && r.dn === 1;
    case 'missing': return r.cov === 0;
    default: return true;
  }
}

function searchMatch(r, q){
  return !q || [r.t,r.d,r.c,r.a,r.sc].some(v => v && String(v).toLowerCase().includes(q));
}

function filteredWithoutCategory(){
  const q=state.q.trim().toLowerCase();
  return REC.filter(r => passesCover(r,state.cover) && searchMatch(r,q));
}

function renderCategorySelect(){
  const list=filteredWithoutCategory();
  const counts={};
  list.forEach(r=>counts[r.c]=(counts[r.c]||0)+1);
  const cats=Object.keys(counts).sort((a,b)=>counts[b]-counts[a] || a.localeCompare(b));
  const sel=document.getElementById('category');
  const prev=state.cat;
  sel.innerHTML='<option value="All">All Categories ('+list.length.toLocaleString()+')</option>' +
    cats.map(c=>'<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+' ('+counts[c].toLocaleString()+')</option>').join('');
  sel.value=counts[prev] ? prev : 'All';
  state.cat=sel.value;
}

function sortRecords(list){
  const arr=list.slice();
  const dateVal=r=>r.dt||r.ingested_at||'';
  const byDateDesc=(a,b)=>String(dateVal(b)).localeCompare(String(dateVal(a)));
  switch(state.sort){
    case 'cat_az': arr.sort((a,b)=>(a.c||'').localeCompare(b.c||'')||(a.t||'').localeCompare(b.t||'')); break;
    case 'cat_za': arr.sort((a,b)=>(b.c||'').localeCompare(a.c||'')||(a.t||'').localeCompare(b.t||'')); break;
    case 'title_az': arr.sort((a,b)=>(a.t||'').localeCompare(b.t||'')); break;
    case 'title_za': arr.sort((a,b)=>(b.t||'').localeCompare(a.t||'')); break;
    case 'creator_az': arr.sort((a,b)=>(a.a||'').localeCompare(b.a||'')); break;
    case 'creator_za': arr.sort((a,b)=>(b.a||'').localeCompare(a.a||'')); break;
    case 'newest': arr.sort(byDateDesc); break;
    case 'oldest': arr.sort((a,b)=>byDateDesc(b,a)); break;
    default: break;
  }
  return arr;
}

function applyFilters(){
  const q=state.q.trim().toLowerCase();
  filtered=sortRecords(REC.filter(r => passesCover(r,state.cover) && (state.cat==='All'||r.c===state.cat) && searchMatch(r,q)));
  shown=0;
  document.getElementById('grid').innerHTML='';
  document.getElementById('groupwrap').innerHTML='';
  if(state.cover==='dup'){
    document.getElementById('grid').style.display='none';
    document.getElementById('groupwrap').style.display='block';
    document.getElementById('loadmore-wrap').style.display='none';
    renderGroups();
  }else{
    document.getElementById('grid').style.display='grid';
    document.getElementById('groupwrap').style.display='none';
    renderMore();
  }
  renderCategorySelect();
  updateChrome();
}

function cardHtml(r){
  const src=imgSrc(r);
  const img=src ? '<img loading="lazy" decoding="async" src="'+src+'" alt="'+escapeHtml(r.t)+'" onerror="this.closest(\'.thumb\').classList.add(\'image-error\')">'
                : '<div class="noimg"><span class="icon">📷</span>Cover unavailable</div>';
  const dup=r.dn>1 ? '<span class="dupbadge">Same cover · '+r.dn+'</span>' : '';
  return '<article class="card"><div class="thumb">'+img+'<span class="badge">'+escapeHtml(r.c)+'</span>'+dup+'</div><div class="body"><p class="card-title">'+escapeHtml(r.t)+'</p><p class="desc">'+escapeHtml(r.d)+'</p><div class="meta"><span>'+escapeHtml(r.a?'@'+r.a:'')+'</span><span class="sc">'+escapeHtml(r.sc)+'</span></div><a class="link" href="'+escapeHtml(r.u)+'" target="_blank" rel="noopener noreferrer">▶ Open on Instagram</a></div></article>';
}

function renderMore(){
  const slice=filtered.slice(shown,shown+PAGE_SIZE);
  document.getElementById('grid').insertAdjacentHTML('beforeend',slice.map(cardHtml).join(''));
  shown+=slice.length;
  document.getElementById('loadmore-wrap').style.display=filtered.length>shown?'flex':'none';
}

function renderGroups(){
  const groups={}; const order=[];
  filtered.forEach(r=>{if(!groups[r.sha]){groups[r.sha]=[];order.push(r.sha);}groups[r.sha].push(r);});
  document.getElementById('groupwrap').innerHTML=order.map(sha=>{
    const members=groups[sha]; const r=members[0];
    return '<section class="group"><div class="group-head">'+(imgSrc(r)?'<img src="'+imgSrc(r)+'" alt="shared cover">':'<div class="noimg-mini"></div>')+'<div><div class="ghtext">Same cover</div><div class="ghsub">'+members.length+' Reels share this exact cover image</div></div></div><div class="group-grid">'+members.map(cardHtml).join('')+'</div></section>';
  }).join('');
}

function updateChrome(){
  const total=document.getElementById('totalReelsCount'); if(total) total.textContent=REC.length.toLocaleString()+' Reels';
  const rc=document.getElementById('resultCount'); if(rc) rc.textContent=filtered.length.toLocaleString()+' Reel'+(filtered.length===1?'':'s');
  document.getElementById('empty').style.display=filtered.length?'none':'block';
  const cat=document.getElementById('category'); if(cat && cat.value!==state.cat) cat.value=state.cat;
  const chips=[];
  if(state.cat!=='All') chips.push(state.cat);
  if(state.q.trim()) chips.push('“'+state.q.trim()+'”');
  if(state.sort!=='default') chips.push(document.getElementById('sort').selectedOptions[0]?.textContent||'Sorted');
  document.getElementById('activeChips').innerHTML=chips.map(x=>'<span class="chip">'+escapeHtml(x)+'</span>').join('');
}

async function boot(){
  try{
    const [r,m]=await Promise.all([fetch('data/reels.json',{cache:'no-store'}),fetch('data/meta.json',{cache:'no-store'})]);
    if(!r.ok||!m.ok) throw new Error('Library data could not be loaded');
    REC=await r.json(); META=await m.json();
    if(!Array.isArray(REC)||!REC.length) throw new Error('Library dataset is empty');
    applyFilters();
  }catch(err){
    console.error(err);
    document.getElementById('grid').innerHTML='<div style="padding:40px;color:#f87171">Unable to load the Reel library. Please refresh the page.</div>';
  }
}

document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value;applyFilters();});
document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;applyFilters();});
document.getElementById('category').addEventListener('change',e=>{state.cat=e.target.value;applyFilters();});
document.getElementById('loadmore').addEventListener('click',renderMore);
document.getElementById('clearFilters').addEventListener('click',()=>{
  state={cover:'all',cat:'All',q:'',sort:'default'};
  document.getElementById('search').value='';
  document.getElementById('sort').value='default';
  applyFilters();
});
document.querySelectorAll('.pill').forEach(btn=>btn.addEventListener('click',()=>{state.cover=btn.dataset.cover;applyFilters();}));

/* Header state machine: top=full, down=hidden, up=compact, returnToTop=visible lock. */
const header=document.querySelector('header');
const backtop=document.getElementById('backtop');
let lastScrollY=Math.max(0,window.scrollY||0), scrollRaf=0, returnToTop=false;
const DIRECTION_THRESHOLD=6, TOP_THRESHOLD=8;
function setHeaderMode(mode){header.classList.remove('header-compact','header-hidden');if(mode==='compact')header.classList.add('header-compact');if(mode==='hidden')header.classList.add('header-hidden');}
function updateHeader(){
 const y=Math.max(0,window.scrollY||0);
 if(returnToTop){ setHeaderMode(y<=TOP_THRESHOLD?'top':'compact'); if(y<=TOP_THRESHOLD){returnToTop=false;setHeaderMode('top');} return; }
 if(y<=TOP_THRESHOLD){setHeaderMode('top');return;}
 const d=y-lastScrollY; if(Math.abs(d)<DIRECTION_THRESHOLD)return;
 setHeaderMode(d>0?'hidden':'compact'); lastScrollY=y;
}
window.addEventListener('scroll',()=>{backtop.classList.toggle('show',window.scrollY>800);if(scrollRaf)return;scrollRaf=requestAnimationFrame(()=>{scrollRaf=0;updateHeader();lastScrollY=Math.max(0,window.scrollY||0);});},{passive:true});
backtop.addEventListener('click',()=>{returnToTop=true;setHeaderMode('top');backtop.blur();window.scrollTo({top:0,behavior:'smooth'});});
setHeaderMode(window.scrollY<=TOP_THRESHOLD?'top':'compact');
boot();
</script>
</body>
